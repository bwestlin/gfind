[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} [**breaking**]{% endif %}
{% endfor -%}
{% endfor %}\
"""
trim = true

[git]
conventional_commits = true
require_conventional = false
filter_unconventional = false
protect_breaking_commits = true
filter_commits = true
fail_on_unmatched_commit = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
    { pattern = "^A first working version$", replace = "Initial release" },
]
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs?", group = "Documentation" },
    { message = "^revert", group = "Reverted" },
    { message = "^(build|ci|chore|style|test)", skip = true },

    # These commits predate the Conventional Commits policy. Pin their handling
    # by SHA so future unconventional messages cannot match these exceptions.
    { sha = "a69f9a3496c30b828ac606f82388902d025d4fd6", skip = true },
    { sha = "2a46717b1449a2f9dbfcee367d9509d67bfe8b58", skip = true },
    { sha = "d5436f9e599effb76f98764ce81f5fdf01f193b0", group = "Added" },
    { sha = "6d32f7dc8252d2711009bdb3962e34edf07b34e2", skip = true },
    { sha = "01ab6d3bbfcc9a51c00658687785662af970fc9b", skip = true },
    { sha = "c09c42e9e0c7edd11e8264e44c174c94df007ac4", skip = true },
    { sha = "493f353583980106ae14a2f086530142c99111c9", skip = true },
]
