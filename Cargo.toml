[package]
name = "gfind"
version = "0.1.0"
edition = "2024"
description = "Find repositories, branches, commits, statuses, and stashes across Git repositories"
license = "MIT"
repository = "https://github.com/bwestlin/gfind"
homepage = "https://github.com/bwestlin/gfind"
readme = "README.md"
keywords = ["git", "repository", "search", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
clap = { version = "4.5.40", features = ["derive", "string"] }
clap_complete = "4.6.5"
owo-colors = "4.2.2"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.18"
toml = "0.8.23"
